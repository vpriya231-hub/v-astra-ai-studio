<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: sans-serif; text-align: center; background: #fff; padding: 10px; }
  .box { max-width: 450px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
  input { width: 85%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
  button { width: 90%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  #finalCanvas { display: none; width: 100%; margin-top: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #eee; }
  p { font-size: 14px; color: #666; margin-top: 10px; display: none; }
</style>
</head>
<body>

<div class="box">
  <h2 style="color:#007bff">V-Astra AI Studio</h2>
  <input type="text" id="pInput" placeholder="Describe your image...">
  <button onclick="gen()">Create Image</button>
  <div class="loader" id="ldr"></div>
  
  <!-- The final image with watermark will show here -->
  <canvas id="finalCanvas"></canvas>
  <p id="msg">Long press the image above to Save to Gallery</p>
</div>

<script>
function gen() {
  var p = document.getElementById('pInput').value.trim();
  if(!p) return alert("Please enter a description");

  var ldr = document.getElementById('ldr');
  var canvas = document.getElementById('finalCanvas');
  var msg = document.getElementById('msg');
  var ctx = canvas.getContext('2d');

  ldr.style.display = "block";
  canvas.style.display = "none";
  msg.style.display = "none";

  var seed = Math.floor(Math.random() * 1000000);
  var img = new Image();
  img.crossOrigin = "anonymous";
  img.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(p) + "?seed=" + seed + "&width=1024&height=1024&nologo=true";

  img.onload = function() {
    canvas.width = 1024;
    canvas.height = 1024;
    
    // Draw Image
    ctx.drawImage(img, 0, 0);

    // Draw Watermark directly on the display image
    ctx.font = "bold 35px Arial";
    ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
    ctx.textAlign = "right";
    ctx.fillText("V-Astra AI", canvas.width - 30, canvas.height - 30);

    ldr.style.display = "none";
    canvas.style.display = "block";
    msg.style.display = "block";
  };

  img.onerror = function() {
    ldr.style.display = "none";
    alert("Generation failed. Try again.");
  };
}
</script>
</body>
</html>
