<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { 
    font-family: sans-serif; 
    text-align: center; 
    background: #ffffff; 
    margin: 0; 
    padding: 10px;
  }
  .box { 
    max-width: 500px; 
    margin: auto; 
    padding: 20px; 
    border-radius: 20px; 
    box-shadow: 0 5px 25px rgba(0,0,0,0.1); 
    background: #fff;
  }
  h2 { color: #007bff; margin-bottom: 20px; }
  input { 
    width: 100%; 
    padding: 15px; 
    margin-bottom: 15px; 
    border: 2px solid #f0f0f0; 
    border-radius: 12px; 
    box-sizing: border-box; 
    font-size: 16px;
  }
  button { 
    width: 100%; 
    padding: 15px; 
    background: #007bff; 
    color: white; 
    border: none; 
    border-radius: 12px; 
    cursor: pointer; 
    font-weight: bold; 
    font-size: 16px;
  }
  .loader { 
    display: none; 
    border: 5px solid #f3f3f3; 
    border-top: 5px solid #007bff; 
    border-radius: 50%; 
    width: 40px; 
    height: 40px; 
    animation: spin 1s linear infinite; 
    margin: 20px auto; 
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  
  /* ഇമേജ് സ്ക്രീനിന്റെ ഫുൾ വലിപ്പത്തിൽ വരാൻ */
  #resImg { 
    display: none; 
    width: 100%; 
    height: auto; 
    border-radius: 15px; 
    margin-top: 20px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  
  .instruction { 
    font-size: 14px; 
    color: #888; 
    margin-top: 15px; 
    display: none;
  }
</style>
</head>
<body>

<div class="box">
  <h2>V-Astra AI Studio</h2>
  <input type="text" id="pInput" placeholder="Enter image description in English...">
  <button onclick="gen()">Create Image</button>
  
  <div class="loader" id="ldr"></div>
  
  <!-- Image display -->
  <img id="resImg" src="">
  
  <p class="instruction" id="ins">Long press the image to Save to Gallery</p>
</div>

<script>
function gen() {
  var p = document.getElementById('pInput').value.trim();
  if(!p) return alert("Please enter a description!");

  var l = document.getElementById('ldr');
  var i = document.getElementById('resImg');
  var n = document.getElementById('ins');

  l.style.display = "block"; 
  i.style.display = "none"; 
  n.style.display = "none";

  var seed = Math.floor(Math.random() * 1000000);
  // Pollinations നേരിട്ടുള്ള ഇമേജ് ലിങ്ക്
  i.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(p) + "?seed=" + seed + "&width=1024&height=1024&nologo=true";

  i.onload = function() {
    l.style.display = "none";
    i.style.display = "block";
    n.style.display = "block";
  };
  
  i.onerror = function() {
    l.style.display = "none";
    alert("Error generating image. Try again.");
  };
}
</script>

</body>
</html>
